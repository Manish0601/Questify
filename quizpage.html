<!DOCTYPE html>
<html>

<head>

<title>Questify</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="quiz-container">

<div class="quiz-header">

<h2>QUIZ</h2>

<div class="timer">01:20</div>

</div>


<div class="quiz-body">

<!-- LEFT SIDEBAR -->

<div class="quiz-sidebar">

<h3>Quiz Progress</h3>
<p>Question 3 of 5</p>

<div class="qbox active">1</div>
<div class="qbox">2</div>
<div class="qbox">3</div>
<div class="qbox">4</div>
<div class="qbox">5</div>

</div>


<!-- QUESTION AREA -->

<div class="quiz-main">

<h2 class="question">
Which language adds interactivity?
</h2>


<div class="options">

<label class="option">

<input type="radio" name="q1">

<span>CSS</span>

</label>


<label class="option">

<input type="radio" name="q1">

<span>Java</span>

</label>


<label class="option">

<input type="radio" name="q1">

<span>JavaScript</span>

</label>


<label class="option">

<input type="radio" name="q1">

<span>HTML</span>

</label>

</div>


<div class="quiz-buttons">

<button class="submit">Submit</button>

<button class="next">Next →</button>

</div>

</div>

</div>

</div>

</body>
<script src="js/security.js"></script>
<script src="js/script.js"></script>
</html>
